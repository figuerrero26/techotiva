<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportar información | Cuida Tu Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Ingresar información</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot" style="display:none"></span></div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1>Registrar seguimiento</h1>
        <p>Ingresa la información de sesiones, actividades y novedades de las personas a tu cargo.</p>
      </div>

      <div class="grid-2">

        <!-- FORMULARIO -->
        <div class="panel">
          <div class="panel-head"><span class="panel-title">Nuevo registro</span></div>

          <div class="field" style="margin-bottom:0.75rem">
            <label>Persona *</label>
            <select id="form-persona" style="width:100%">
              <option value="">Cargando...</option>
            </select>
          </div>

          <div class="field" style="margin-bottom:0.75rem">
            <label>Tipo de registro *</label>
            <select id="form-tipo" style="width:100%">
              <option value="Sesión grupal">Sesión grupal</option>
              <option value="Seguimiento individual">Seguimiento individual</option>
              <option value="Actividad especial">Actividad especial</option>
              <option value="Primer contacto">Primer contacto</option>
              <option value="Cierre de proceso">Cierre de proceso</option>
            </select>
          </div>

          <div class="field" style="margin-bottom:0.75rem">
            <label>Observaciones</label>
            <textarea id="form-observaciones" placeholder="Describe las novedades, avances o situaciones relevantes..."
                      style="width:100%;min-height:120px;resize:vertical"></textarea>
          </div>

          <div id="form-error"
               style="display:none;color:var(--error);font-size:0.82rem;margin-bottom:0.75rem;
                      background:var(--error-dim);padding:0.5rem 0.75rem;border-radius:var(--radius-sm)"></div>

          <div style="display:flex;gap:0.75rem">
            <button class="btn btn-sm btn-outline" onclick="limpiarFormulario()">Limpiar</button>
            <button class="btn btn-sm btn-green" id="btn-guardar-registro" onclick="guardarRegistro()">Guardar registro</button>
          </div>
        </div>

        <!-- REGISTROS RECIENTES -->
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Registros recientes</span>
            <span class="tag mustard" id="count-registros">0</span>
          </div>
          <div id="lista-registros">
            <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:0.5rem">Cargando...</div>
          </div>
        </div>

      </div>

      <!-- ASIGNADOS CON ESTADO -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Estado de seguimiento</span>
          <button class="panel-action" onclick="window.location.href='/usuarios'">Ver todos →</button>
        </div>
        <div id="tabla-asignados">
          <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:0.5rem">Cargando...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/reportar-info.js"></script>
</body>
</html>
