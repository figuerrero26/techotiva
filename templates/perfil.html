<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil | Cuida Tu Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <!-- SIDEBAR — inyectado por mascate-utils.js renderSidebar() -->
  <nav class="sidebar"></nav>
  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Perfil de usuario</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot"></span></div>
        <button class="btn btn-sm btn-mustard">Editar perfil</button>
      </div>
    </div>
    <div class="content">
      <!-- HERO -->
      <div class="panel" style="margin-bottom:1.5rem">
        <div style="display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap">
          <div id="hero-avatar" class="list-avatar" style="width:3.5rem;height:3.5rem;font-size:1.1rem;flex-shrink:0;">—</div>
          <div style="flex:1">
            <h1 id="hero-nombre" style="margin:0 0 0.25rem;font-size:1.4rem">—</h1>
            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
              <span class="tag mustard" id="hero-rol">—</span>
              <span id="hero-desc" style="font-size:0.82rem;color:var(--on-bg-muted)"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- STATS -->
      <div class="stats-row cols-4">
        <div class="stat-card"><div class="stat-icon mustard" id="stat-icon-0">📅</div><div class="stat-val" id="stat-0">—</div><div class="stat-label" id="stat-lbl-0">Actividades</div></div>
        <div class="stat-card"><div class="stat-icon green"   id="stat-icon-1">✅</div><div class="stat-val" id="stat-1">—</div><div class="stat-label" id="stat-lbl-1">Asistencia</div></div>
        <div class="stat-card"><div class="stat-icon blue"    id="stat-icon-2">⭐</div><div class="stat-val" id="stat-2">—</div><div class="stat-label" id="stat-lbl-2">Eventos activos</div></div>
        <div class="stat-card"><div class="stat-icon rust"    id="stat-icon-3">🎯</div><div class="stat-val" id="stat-3">—</div><div class="stat-label" id="stat-lbl-3">Progreso</div></div>
      </div>
      <!-- INFO + CONTACTO -->
      <div class="grid-2">
        <div class="panel" id="panel-info">
          <div class="panel-head"><span class="panel-title">Información personal</span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem" id="info-grid"></div>
        </div>
        <div class="panel" id="panel-contacto">
          <div class="panel-head"><span class="panel-title" id="contacto-titulo">Contactos y seguimiento</span></div>
          <div id="contacto-list"></div>
        </div>
      </div>
      <!-- ACTIVIDADES RECIENTES -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Actividades recientes</span>
          <button class="panel-action">Ver todas →</button>
        </div>
        <div class="grid-3" id="acts-grid">
          <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:1rem">Cargando actividades...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MODAL DETALLE ACTIVIDAD ═══ -->
<div id="modal-det-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;padding:1rem">
  <div style="background:var(--surface);border-radius:var(--radius-lg);padding:2rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;position:relative">
    <button onclick="document.getElementById('modal-det-overlay').style.display='none'"
      style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.25rem;cursor:pointer;color:var(--on-bg-muted)">✕</button>
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem">
      <h2 id="det-nombre" style="margin:0;font-size:1.2rem;flex:1">—</h2>
      <span id="det-tipo" class="tag mustard">—</span>
    </div>
    <p id="det-descripcion" style="font-size:0.88rem;color:var(--on-bg-muted);margin:0 0 1.25rem"></p>
    <div id="det-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.25rem"></div>
    <div id="det-acciones" style="display:flex;gap:0.75rem;flex-wrap:wrap"></div>
  </div>
</div>


<!-- ═══ MODAL EDITAR PERFIL ═══ -->
<div id="modal-edit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;overflow-y:auto">
  <div class="panel" style="width:100%;max-width:480px;margin:2rem auto;position:relative">
    <button onclick="cerrarModalEdit()"
      style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--on-bg-muted)">✕</button>
    <div class="panel-head"><span class="panel-title">✏️ Editar perfil</span></div>
    <div id="edit-fields" style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem"></div>
    <div id="edit-error"
      style="display:none;color:var(--error);font-size:0.82rem;margin-top:0.75rem;
             background:var(--error-dim);padding:0.5rem 0.75rem;border-radius:var(--radius-sm)"></div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-sm btn-outline" onclick="cerrarModalEdit()">Cancelar</button>
      <button class="btn btn-sm btn-green" id="edit-btn-guardar" onclick="guardarPerfil()">Guardar cambios</button>
    </div>
  </div>
</div>
<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/perfil.js"></script>
</body>
</html>
