<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades | Cuida Tu Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">

    <!-- SIDEBAR — inyectado por mascate-utils.js renderSidebar() -->
  <nav class="sidebar"></nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Actividades</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot"></span></div>
        <button class="btn btn-sm btn-mustard" id="btn-nueva">+ Nueva actividad</button>
      </div>
    </div>

    <div class="content">
      <div class="page-header">
        <h1>Actividades comunitarias</h1>
        <p>Consulta eventos, talleres y procesos activos.</p>
      </div>

      <!-- STATS -->
      <div class="stats-row cols-4">
        <div class="stat-card"><div class="stat-icon mustard">📅</div><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total actividades</div></div>
        <div class="stat-card"><div class="stat-icon green">🏘️</div><div class="stat-val" id="stat-dispositivos">—</div><div class="stat-label">Dispositivos</div></div>
        <div class="stat-card"><div class="stat-icon blue">🎨</div><div class="stat-val" id="stat-tipos">—</div><div class="stat-label">Tipos distintos</div></div>
        <div class="stat-card"><div class="stat-icon rust">📍</div><div class="stat-val" id="stat-lugares">—</div><div class="stat-label">Lugares</div></div>
      </div>

      <!-- CARDS -->
      <div class="grid-3" id="acts-cards">
        <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:1rem">Cargando actividades...</div>
      </div>

      <!-- TABLA -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Todas las actividades</span>
          <button class="panel-action">Ver todas →</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>Actividad</th><th>Tipo</th><th>Lugar</th><th>Día</th><th>Hora</th></tr>
            </thead>
            <tbody id="acts-tbody">
              <tr><td colspan="5" style="color:var(--on-bg-muted)">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

<div id="modal-act-overlay"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
             z-index:1000;align-items:center;justify-content:center;overflow-y:auto">
  <div class="panel" style="width:100%;max-width:520px;margin:2rem auto;position:relative">
    <button onclick="cerrarModalAct()"
            style="position:absolute;top:1rem;right:1rem;background:none;border:none;
                   font-size:1.2rem;cursor:pointer;color:var(--on-bg-muted)">✕</button>
    <div class="panel-head"><span class="panel-title" id="modal-act-titulo">Nueva actividad</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="field" style="grid-column:1/-1">
        <label>Nombre *</label>
        <input type="text" id="act-nombre" placeholder="Ej: Taller de grafiti" style="width:100%">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="act-tipo" style="width:100%">
          <option value="">Selecciona...</option>
          <option>Artístico</option><option>Cultural</option><option>Deportivo</option>
          <option>Ambiental</option><option>Educativo</option><option>Escucha</option>
        </select>
      </div>
      <div class="field">
        <label>Emoji</label>
        <input type="text" id="act-emoji" placeholder="🎨" style="width:100%" maxlength="2">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Lugar</label>
        <input type="text" id="act-lugar" placeholder="Ej: Parque El Tintal" style="width:100%">
      </div>
      <div class="field">
        <label>Día de la semana</label>
        <input type="text" id="act-dia" placeholder="Ej: Lunes, Miércoles" style="width:100%">
      </div>
      <div class="field">
        <label>Hora</label>
        <input type="time" id="act-hora" style="width:100%">
      </div>
      <div class="field">
        <label>Cupo máximo</label>
        <input type="number" id="act-cupo" placeholder="Ej: 20" style="width:100%" min="1">
      </div>
      <div class="field">
        <label>Fecha de inicio</label>
        <input type="date" id="act-fecha" style="width:100%">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Descripción</label>
        <textarea id="act-descripcion" placeholder="Describe la actividad..."
                  style="width:100%;min-height:80px;resize:vertical"></textarea>
      </div>
    </div>
    <div id="act-error"
         style="display:none;color:var(--error);font-size:0.82rem;margin:0.75rem 0;
                background:var(--error-dim);padding:0.5rem 0.75rem;border-radius:var(--radius-sm)"></div>
    <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-sm btn-outline" onclick="cerrarModalAct()">Cancelar</button>
      <button class="btn btn-sm btn-green" id="act-btn-guardar" onclick="guardarActividad()">Crear actividad</button>
    </div>
  </div>
</div>
</div>
<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/actividades.js"></script>
</body>
</html>
