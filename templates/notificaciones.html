<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones | Cuida Tu Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <nav class="sidebar">
    <div class="sb-brand"><div class="sb-logo">🔔</div><div><div class="sb-name">Cuida Tu Techo</div><div class="sb-role-tag" id="sb-role-tag">—</div></div></div>
    <span class="sb-section">Principal</span>
    <a class="sb-item" href="/dashboard"><span class="ic">🏠</span> Dashboard</a>
    <a class="sb-item" href="/usuarios"><span class="ic">👥</span> Usuarios</a>
    <a class="sb-item" href="/actividades"><span class="ic">📅</span> Actividades</a>
    <a class="sb-item" href="/reportes"><span class="ic">📊</span> Reportes</a>
    <a class="sb-item" href="/perfil"><span class="ic">👤</span> Perfil</a>
    <a class="sb-item active" href="/notificaciones"><span class="ic">🔔</span> Notificaciones</a>
    <a class="sb-item" href="/configuracion"><span class="ic">⚙️</span> Configuración</a>
    <div class="sb-spacer"></div>
    <div class="sb-user">
      <div class="sb-avatar" id="sb-avatar" style="background:var(--error-dim);color:var(--error)">—</div>
      <div><div class="sb-uname" id="sb-uname">—</div><div class="sb-uemail" id="sb-uemail">—</div></div>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Notificaciones</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot"></span></div>
        <button class="btn btn-sm btn-outline" id="btn-marcar-leido">Marcar todo leído</button>
      </div>
    </div>
    <div class="content">
      <div class="page-header"><h1>Centro de notificaciones</h1><p id="notif-subtitle">Cargando...</p></div>
      <div class="panel" style="padding:0;overflow:hidden" id="notif-list">
        <div style="padding:1rem;color:var(--on-bg-muted)">Cargando notificaciones...</div>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/notificaciones.js"></script>
</body>
</html>
