      <span class="topbar-title">Reportes</span>

        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot"></span></div>

      <div class="panel">

          <table>
            <thead><tr><th>Dispositivo</th><th>Beneficiarixs</th><th>Actividades</th><th>Asistencia</th><th>Estado</th></tr></thead>
