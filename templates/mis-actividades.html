<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis actividades | Cuida Tu Techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Mis actividades</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot" style="display:none"></span></div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1>Mis actividades inscritas</h1>
        <p>Actividades en las que participas actualmente.</p>
      </div>
      <div class="stats-row cols-3">
        <div class="stat-card"><div class="stat-icon mustard">📅</div><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total inscritas</div></div>
        <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-val" id="stat-activas">—</div><div class="stat-label">Activas</div></div>
        <div class="stat-card"><div class="stat-icon blue">🎯</div><div class="stat-val" id="stat-tipos">—</div><div class="stat-label">Tipos distintos</div></div>
      </div>
      <div class="grid-3" id="mis-acts-grid">
        <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:1rem">Cargando...</div>
      </div>
      <div class="panel" style="margin-top:0">
        <div class="panel-head">
          <span class="panel-title">Explorar más actividades</span>
          <button class="panel-action" onclick="window.location.href='/actividades'">Ver todas →</button>
        </div>
        <p style="font-size:0.85rem;color:var(--on-bg-muted)">¿Quieres unirte a más actividades? Explora todo lo disponible en tu territorio.</p>
        <button class="btn btn-sm btn-green" onclick="window.location.href='/actividades'">🔍 Buscar actividades</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/mis-actividades.js"></script>
</body>
</html>
