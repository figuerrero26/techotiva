<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescriptxres | MASCATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Prescriptxres</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot" style="display:none"></span></div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1>Prescriptxres de mi dispositivo</h1>
        <p>Personas facilitadoras vinculadas a tu dispositivo CBC.</p>
      </div>

      <div class="stats-row cols-3">
        <div class="stat-card"><div class="stat-icon green">🎯</div><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total prescriptxres</div></div>
        <div class="stat-card"><div class="stat-icon mustard">✅</div><div class="stat-val" id="stat-activos">—</div><div class="stat-label">Activos</div></div>
        <div class="stat-card"><div class="stat-icon rust">⏳</div><div class="stat-val" id="stat-pendientes">—</div><div class="stat-label">Pendientes aprobación</div></div>
      </div>

      <!-- Pendientes de aprobación -->
      <div id="panel-pendientes" class="panel" style="display:none;border:1.5px solid var(--error)">
        <div class="panel-head">
          <span class="panel-title">⚠️ Pendientes de aprobación</span>
          <span class="tag rust" id="count-pendientes">0</span>
        </div>
        <div id="lista-pendientes"></div>
      </div>

      <!-- Lista de prescriptores -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Todos los prescriptxres</span>
        </div>
        <div id="lista-prescriptores">
          <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:0.5rem">Cargando...</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/mis-prescriptores.js"></script>
</body>
</html>
