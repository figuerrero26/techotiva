<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de dispositivos | MASCATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="top-bar"></div>
<div class="screen active">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Mapa de dispositivos</span>
      <div class="topbar-right">
        <div class="notif-btn" onclick="window.location.href='/notificaciones'" style="cursor:pointer">🔔<span class="notif-dot" style="display:none"></span></div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1>Dispositivos CBC en Techotiva</h1>
        <p>Bases comunitarias, clubes y espacios de encuentro en el territorio.</p>
      </div>

      <!-- Buscador -->
      <div class="panel" style="padding:0.75rem 1rem">
        <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
          <span style="font-size:1.1rem">🔍</span>
          <input id="mapa-search" type="text" placeholder="Buscar por nombre, barrio o tipo..."
                 style="flex:1;border:none;outline:none;background:transparent;font-size:0.9rem">
          <select id="mapa-tipo" style="font-size:0.82rem">
            <option value="">Todos los tipos</option>
            <option>Artístico</option><option>Deportivo</option><option>Cultural</option>
            <option>Ambiental</option><option>Educativo</option><option>Centro de escucha</option>
          </select>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row cols-3">
        <div class="stat-card"><div class="stat-icon green">🏘️</div><div class="stat-val" id="mapa-stat-total">—</div><div class="stat-label">Dispositivos activos</div></div>
        <div class="stat-card"><div class="stat-icon mustard">📍</div><div class="stat-val" id="mapa-stat-zonas">—</div><div class="stat-label">Zonas cubiertas</div></div>
        <div class="stat-card" id="card-benefs" style="display:none"><div class="stat-icon blue">🌱</div><div class="stat-val" id="mapa-stat-benefs">—</div><div class="stat-label">Beneficiarixs</div></div>
      </div>

      <!-- Lista de dispositivos -->
      <div id="mapa-grid" class="grid-2">
        <div style="color:var(--on-bg-muted);font-size:0.85rem;padding:1rem">Cargando dispositivos...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal detalle dispositivo -->
<div id="modal-disp-detalle"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
            z-index:1000;align-items:center;justify-content:center">
  <div class="panel" style="width:100%;max-width:480px;margin:1rem;position:relative">
    <button onclick="document.getElementById('modal-disp-detalle').style.display='none'"
            style="position:absolute;top:1rem;right:1rem;background:none;border:none;
                   font-size:1.2rem;cursor:pointer;color:var(--on-bg-muted)">✕</button>
    <div id="modal-disp-content"></div>
  </div>
</div>

<script src="/static/js/mascate-utils.js"></script>
<script src="/static/js/mapa.js"></script>
</body>
</html>
